name: covector status
on: [pull_request]

permissions:
  contents: read

jobs:
  covector:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: covector status
        uses: jbolda/covector/packages/action@af8d85bc327db1bb4720bfdaa7cd2c4d3f1b244d # covector-v0
        with:
          command: "status"
          token: ${{ secrets.GITHUB_TOKEN }}
          comment: true
